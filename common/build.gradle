architectury {
    common(rootProject.enabled_platforms.split(","))
}

loom {
    accessWidenerPath = file("src/main/resources/immersive_aircraft.accessWidener")
}

// Loom classifies the jar "dev"; with no remapJar on 26.1 this is the real
// artifact, so it must carry no classifier to be resolvable as the main one.
jar {
    archiveClassifier = ""
}

dependencies {
    // We depend on fabric loader here to use the fabric @Environment annotations
    // Do NOT use other classes from fabric loader
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"

    // Fabric API injects interfaces into vanilla types (e.g. FabricResource on
    // Resource), so javac needs it on the classpath even here. compileOnly keeps
    // it out of the common artifact.
    compileOnly "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    implementation 'org.mariuszgromada.math:MathParser.org-mXparser:5.2.1'

    api "com.terraformersmc:modmenu:${mod_menu_version}"

    api("me.shedaniel.cloth:cloth-config-fabric:${cloth_version}") {
        //noinspection GroovyAssignabilityCheck
        exclude(group: "net.fabricmc.fabric-api")
    }

    compileOnlyApi("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")

    compileOnly "me.shedaniel:RoughlyEnoughItems-api:${rei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin:${rei_version}"

    // modCompileOnly "earth.terrarium.adastra:ad_astra-common-${ad_astra_version}"
    // modRuntimeOnly "earth.terrarium.adastra:ad_astra-common-${ad_astra_version}"
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name
            groupId = rootProject.group_id
            version = version + "+common"
            from components.java
        }
    }
}