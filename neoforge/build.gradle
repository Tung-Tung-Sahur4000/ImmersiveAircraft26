architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

repositories {
    maven { url "https://maven.neoforged.net/releases/" }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    forgeRuntimeLibrary 'org.mariuszgromada.math:MathParser.org-mXparser:5.2.1'
    include 'org.mariuszgromada.math:MathParser.org-mXparser:5.2.1'

    compileOnlyApi("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")

    runtimeOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:$rei_version"

    common(project(":common")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive false }
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version,
                loader_major: "1",
                minecraft_version: rootProject.architectury.minecraft
    }

    // Fabric Loader resolves the access widener from this mod's own classpath
    // root. In a dev run that root is this module, not :common, so pull it in.
    from(project(":common").file("src/main/resources/immersive_aircraft.accessWidener"))
}

// There is no remapJar on 26.1: the game is unobfuscated. Making jar itself
// the shippable artifact keeps it inside Loom's Jar-in-Jar processing, which a
// separate shadowJar bypassed - silently dropping bundled libraries and the
// "jars" entry in fabric.mod.json that Fabric needs in order to load them.
jar {
    archiveClassifier = ""
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn configurations.shadowCommon

    from({ configurations.shadowCommon.collect { it.isDirectory() ? it : zipTree(it) } }) {
        exclude "architectury.common.json"
        exclude "fabric.mod.json"
    }
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name
            groupId = rootProject.group_id
            version = version + "+neoforge"
            from components.java

        }
    }
}
