plugins {
    // johnrengelman/shadow does not run on Gradle 9.
    id "com.gradleup.shadow" version "9.6.1"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

repositories {
    maven { url "https://maven.neoforged.net/releases/" }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    forgeRuntimeLibrary 'org.mariuszgromada.math:MathParser.org-mXparser:5.2.1'
    include 'org.mariuszgromada.math:MathParser.org-mXparser:5.2.1'

    compileOnlyApi("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")

    runtimeOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:$rei_version"

    common(project(":common")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive false }
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version,
                loader_major: "1",
                minecraft_version: rootProject.architectury.minecraft
    }

    // Fabric Loader resolves the access widener from this mod's own classpath
    // root. In a dev run that root is this module, not :common, so pull it in.
    from(project(":common").file("src/main/resources/immersive_aircraft.accessWidener"))
}

// No remapJar on 26.1+: nothing needs remapping, so shadowJar is the artifact.
jar {
    archiveClassifier = "dev"
}

shadowJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = ""
}

assemble.dependsOn shadowJar

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name
            groupId = rootProject.group_id
            version = version + "+neoforge"
            from components.java

            // components.java only carries the "dev"-classified jar now that
            // shadowJar is the real artifact; publish that as the main one.
            artifact(shadowJar)
        }
    }
}
