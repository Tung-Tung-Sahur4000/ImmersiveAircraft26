plugins {
    // johnrengelman/shadow does not run on Gradle 9.
    id "com.gradleup.shadow" version "9.6.1"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    implementation 'org.mariuszgromada.math:MathParser.org-mXparser:5.2.1'
    include 'org.mariuszgromada.math:MathParser.org-mXparser:5.2.1'

    compileOnly("com.terraformersmc:modmenu:${rootProject.mod_menu_version}") { transitive false }

    compileOnlyApi("mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}")

    runtimeOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:$rei_version"

    // Required to run JEI
    runtimeOnly("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")

    // Required to run REI
    //modRuntimeOnly "dev.architectury:architectury-fabric:${rootProject.architectury_version}"
    //modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:$rei_version"

    // modCompileOnly "earth.terrarium.adastra:ad_astra-fabric-${ad_astra_version}"
    // modRuntimeOnly "earth.terrarium.adastra:ad_astra-fabric-${ad_astra_version}"

    // modRuntimeOnly "net.conczin:man_of_many_planes:${man_of_many_planes_version}+fabric"
    // modRuntimeOnly "net.conczin:immersive_machinery:${immersive_machinery}+fabric"

    common(project(":common")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// No remapJar on 26.1+: nothing needs remapping, so shadowJar is the artifact.
jar {
    archiveClassifier = "dev"
}

shadowJar {
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = ""
}

assemble.dependsOn shadowJar

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name
            groupId = rootProject.group_id
            version = version + "+fabric"
            from components.java

            // components.java only carries the "dev"-classified jar now that
            // shadowJar is the real artifact; publish that as the main one.
            artifact(shadowJar)
        }
    }
}
